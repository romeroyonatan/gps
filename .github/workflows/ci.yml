name: CI

on:
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Instalar dependencias
        run: bun install --frozen-lockfile

      - name: Lint y formato
        run: bunx biome check .

      - name: Generar tipos del cliente
        run: bun run --filter @gps/api codegen

      - name: Chequeo de tipos
        run: bun run compile

      - name: Tests
        run: bun test

      - name: Verificar que schema.gql esta al dia
        run: |
          bun run schema
          if ! git diff --exit-code schema.gql; then
            echo "::error::schema.gql quedo desactualizado. Corre 'bun run schema' y commitea el resultado."
            exit 1
          fi

      - name: Verificar que el servidor arranca y sirve la aplicación
        env:
          # En produccion no hay clave por defecto: el proceso no arranca sin
          # esta. Una de CI y no un secreto porque no firma nada que importe;
          # lo que se verifica es que el arranque la exija y la sepa leer.
          CLAVES_DE_SELLO: ci=clave-de-ci-que-no-firma-nada
          CLAVE_DE_SELLO_ACTIVA: ci
        run: |
          ENTORNO=produccion PUERTO=3000 bun services/backend/src/index.ts &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/health > /dev/null && break
            sleep 1
          done
          curl -sf http://localhost:3000/health
          curl -sf http://localhost:3000/graphql -H 'content-type: application/json' \
            -d '{"query":"{ version { numero modulos } }"}'
          # Es el unico lugar que ejercita una base en archivo con las
          # migraciones aplicadas al arrancar: si no se consulta una tabla, un
          # esquema roto pasa igual. El grep atrapa el {"errors":[...]}.
          curl -sf http://localhost:3000/graphql -H 'content-type: application/json' \
            -d '{"query":"{ distritos { numero zona grupos { numero unidades { nombre } } } }"}' \
            | grep -q '"distritos"'
          # Una tabla de cada modulo con migraciones: distritos no toca las de
          # salidas ni las de personas, asi que una migracion rota ahi pasaba.
          curl -sf http://localhost:3000/graphql -H 'content-type: application/json' \
            -d '{"query":"{ permisos(grupoId: \"grupo_inexistente\") { id } }"}' \
            | grep -q '"permisos"'
          curl -sf http://localhost:3000/ | grep -q '<div id="raiz">'

      - name: Verificar que en produccion no arranca sin clave de sello
        run: |
          # Un sello hecho con una clave de desarrollo no prueba nada, y el
          # error tiene que ser al arrancar y no al primer permiso que alguien
          # firme.
          if ENTORNO=produccion PUERTO=3001 bun services/backend/src/index.ts; then
            echo "::error::El backend arranco en produccion sin CLAVES_DE_SELLO."
            exit 1
          fi

      - name: Construir la imagen Docker
        run: docker build -t gps:ci .
