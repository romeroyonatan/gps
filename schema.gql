"""
Un archivo colgado del permiso: una planificacion, un croquis.
"""
type Adjunto {
  archivoId: ID!
  id: ID!
  nombre: String!
  tipo: String

  """
  Por donde se descarga. Ruta y no bytes: un binario no viaja por GraphQL.
  """
  url: String!
}

"""
Una fila de la nómina: cómo estaba esa persona el día de la declaración.
"""
type Afiliado {
  apellidos: String!
  nombres: String!
  numeroDeDocumento: String!
  personaId: ID!
  tipoDeDocumento: TipoDeDocumento!
}

"""
Contra qué entidad apunta una función.
"""
enum AmbitoDeRol {
  diocesis
  distrito
  grupo
}

"""
Un cargo de una persona en su grupo, con su periodo.
"""
type Cargo {
  cargo: TipoDeCargo!
  desde: String!

  """
  Vacía si no tiene fin previsto. Puede estar en el futuro: un mandato dura cuatro años.
  """
  hasta: String
  id: ID!
}

"""
Como pertenece una persona a su grupo.
"""
enum Categoria {
  activo
  adherente
  beneficiario
}

type CuentaDeGrupo {
  cerrado: Boolean!
  grupoId: ID!
  nombre: String!
  numero: Int!

  """
  Positivo es deuda; negativo es saldo a favor.
  """
  saldo: Int!
}

type CuotaDeAfiliacion {
  importe: Int!
  periodo: Int!
}

"""
Un cargo en el alta. Su `desde` es el de la pertenencia.
"""
input DatosDeCargo {
  cargo: TipoDeCargo!
  hasta: String
}

"""
El grupo al que ingresa la persona, y como.
"""
input DatosDeIngreso {
  cargos: [DatosDeCargo!]!
  categoria: Categoria!
  desde: String!
  grupoId: ID!
  unidadId: ID
}

"""
Los datos que necesita el alta de una persona.
"""
input DatosDePersona {
  apellidos: String!
  fechaDeNacimiento: String!
  nombres: String!
  numeroDeDocumento: String!
  tipoDeDocumento: TipoDeDocumento!
}

"""
La nómina que un grupo presenta en una fecha.
"""
type Declaracion {
  """
  Los de la nómina que todavía no tenían afiliación ese período.
  """
  aCobrar: [Afiliado!]!

  """
  La nómina completa del grupo ese día.
  """
  afiliados: [Afiliado!]!

  """
  Fecha de calendario en formato aaaa-mm-dd, sin hora ni zona horaria.
  """
  fecha: String!
  id: ID!

  """
  El año en que arranca el período al que cae esta declaración.
  """
  periodo: Int!
}

"""
Un distrito de la diocesis, con sus grupos.
"""
type Distrito {
  grupos: [Grupo!]!
  id: ID!
  numero: Int!
  zona: String!
}

"""
El permiso emitido y lo que el sistema quiere decir sin impedirlo.
"""
type Emision {
  avisos: [String!]!
  permiso: Permiso!
}

"""
El enlace para compartir a mano. El secreto vuelve una única vez: el servidor sólo guarda su hash.
"""
type EnlaceDeInvitacion {
  invitacionId: ID!
  url: String!
}

"""
Como esta una de las tres firmas de un permiso.
"""
type EstadoDeFirma {
  cargo: TipoDeCargo!
  fecha: String
  firmada: Boolean!

  """
  app o papel. Vacío si todavía no firmó.
  """
  modo: String
  nombreDelCargo: String!

  """
  Quien firmo, o quien ocupa el cargo hoy. Vacío si nadie lo ocupa.
  """
  quien: String

  """
  Si el sello cierra. Vacío cuando no hay firma o cuando se firmó en papel, que no lleva sello.
  """
  verificada: Boolean
}

"""
Si el enlace sirve, y si no, por qué.
"""
enum EstadoDeInvitacion {
  revocada
  usada
  valida
  vencida
}

"""
Por donde va un permiso de salida.
"""
enum EstadoDePermiso {
  anulado
  borrador
  emitido
  firmado
}

"""
Un cargo o equipo vigente, con el ámbito donde lo ejerce.
"""
type FuncionVigente {
  ambitoId: ID
  ambitoTipo: AmbitoDeRol!
  rol: Rol!
}

"""
Un grupo scout y las unidades que tiene abiertas.
"""
type Grupo {
  id: ID!
  nombre: String!
  numero: Int!

  """
  De menor a mayor edad y, dentro de una rama, por nombre. Vacia si el grupo no abrio ninguna.
  """
  unidades: [Unidad!]!
}

"""
La pertenencia de una persona a un equipo, con su periodo.
"""
type IntegranteDeEquipo {
  desde: String!
  equipoId: ID!
  hasta: String
  id: ID!
}

"""
Lo que muestra un enlace de activación o recuperación antes de que alguien lo confirme. Un enlace que ya no sirve no dice de quién era.
"""
type Invitacion {
  estado: EstadoDeInvitacion!
  grupo: String
  persona: String
  proveedorAReemplazar: ProveedorDeIdentidad
  tipo: TipoDeInvitacion
}

"""
Quién conduce un grupo hoy, para el directorio de la asociación.
"""
type JefeDeGrupo {
  apellidos: String!
  grupoId: ID!
  nombres: String!
  personaId: ID!
}

"""
Cómo recibió Tesorería un pago externo.
"""
enum MedioDePago {
  efectivo
  otro
  transferencia
}

type MovimientoDeTesoreria {
  anulaA: ID
  cantidad: Int
  cuota: Int
  declaracionId: ID
  fecha: String!
  id: ID!
  importe: Int!
  medioDePago: MedioDePago
  observacion: String
  periodo: Int
  referencia: String
  tipo: TipoDeMovimientoDeTesoreria!
}

type Mutation {
  adjuntarAPermiso(archivoId: ID!, permisoId: ID!): Permiso!
  agregarParticipante(permisoId: ID!, personaId: ID!): Permiso!
  anularPago(pagoId: ID!): MovimientoDeTesoreria!
  anularPermiso(permisoId: ID!): Permiso!

  """
  Nombra a alguien en un cargo de su grupo, su distrito o la diócesis.
  """
  asignarCargo(
    ambitoId: ID
    cargo: TipoDeCargo!
    desde: String!
    hasta: String
    personaId: ID!
  ): Cargo!

  """
  Revoca la sesión de este pedido. El cliente borra su secreto.
  """
  cerrarSesion: Boolean!

  """
  Ultimo paso: valida lo recibido y deja el archivo usable.
  """
  confirmarSubida(id: ID!): ID!
  crearPermiso(
    comoSeViaja: String
    desde: String!
    grupoId: ID!
    hasta: String!
    lugar: String!
  ): Permiso!

  """
  Da de alta una persona y la inscribe en un grupo.
  """
  crearPersona(datos: DatosDePersona!, ingreso: DatosDeIngreso!): Persona!

  """
  Declaración extraordinaria: fotografía al grupo con la fecha de hoy.
  """
  declararAfiliacion(grupoId: ID!): Declaracion!
  definirCuotaDeAfiliacion(importe: Int!, periodo: Int!): CuotaDeAfiliacion!
  elegirUnidades(permisoId: ID!, unidadIds: [ID!]!): Permiso!
  emitirPermiso(permisoId: ID!): Emision!

  """
  Registra una firma dibujada. `trazos` es el JSON de los trazos normalizados.
  """
  firmarEnApp(cargo: TipoDeCargo!, permisoId: ID!, trazos: String!): Permiso!

  """
  Declara qué cargos firmaron el escaneo que se subió.
  """
  firmarEnPapel(cargos: [TipoDeCargo!]!, escaneoId: ID!, permisoId: ID!): Permiso!
  generarDeudasPendientes: ResultadoDeReconciliacion!

  """
  Suma a alguien a Secretaría de su grupo o a un equipo diocesano.
  """
  integrarEquipo(
    ambitoId: ID
    desde: String!
    personaId: ID!
    tipo: TipoDeEquipo!
  ): IntegranteDeEquipo!

  """
  Emite un enlace de activación o de recuperación para una persona del propio ámbito.
  """
  invitar(
    personaId: ID!
    proveedorAReemplazar: ProveedorDeIdentidad
    tipo: TipoDeInvitacion!
  ): EnlaceDeInvitacion!

  """
  Saca un adjunto y borra su archivo. No toca las firmas.
  """
  quitarAdjuntoDePermiso(adjuntoId: ID!, permisoId: ID!): Permiso!
  quitarParticipante(permisoId: ID!, personaId: ID!): Permiso!

  """
  Crea un borrador nuevo con los datos de un permiso anulado.
  """
  reEmitirPermiso(permisoId: ID!): Permiso!
  registrarPago(
    fecha: String!
    grupoId: ID!
    importe: Int!
    medioDePago: MedioDePago!
    observacion: String
    referencia: String
  ): MovimientoDeTesoreria!

  """
  Saca a alguien de un cargo. El acceso se pierde en el pedido siguiente.
  """
  revocarCargo(cargoId: ID!): Boolean!

  """
  Saca a alguien de un equipo. El acceso se pierde en el pedido siguiente.
  """
  revocarIntegranteDeEquipo(integranteId: ID!): Boolean!

  """
  Anula un enlace que todavía no se consumió.
  """
  revocarInvitacion(invitacionId: ID!): Boolean!

  """
  Primer paso de una subida: reserva el archivo y dice por donde mandar los bytes.
  """
  solicitarSubida(
    modulo: String!
    nombre: String!
    recursoId: ID!
    tamano: Int!
    tipo: String!
  ): SubidaPedida!
}

type Participante {
  marca: String!
  personaId: ID!
}

type ParticipanteEmitido {
  apellidos: String!
  marca: String!
  nombres: String!
  numeroDeDocumento: String!
  personaId: ID!
  unidad: String!
}

"""
Un permiso de salida: lo que un grupo presenta para salir o acampar.
"""
type Permiso {
  adjuntos: [Adjunto!]!
  comoSeViaja: String
  desde: String!

  """
  Los que figuran en el papel, tal como estaban al emitirse.
  """
  emitidos: [ParticipanteEmitido!]!
  estado: EstadoDePermiso!
  firmas: [EstadoDeFirma!]!
  hasta: String!
  id: ID!
  lugar: String!

  """
  Los elegidos mientras es borrador.
  """
  participantes: [Participante!]!
  pdfId: ID
  reemplazaA: ID

  """
  Qué unidades del grupo van.
  """
  unidadIds: [ID!]!
}

"""
Un miembro de la asociacion, con sus vinculos vigentes en su grupo.
"""
type Persona {
  apellidos: String!

  """
  Todos, también los vencidos: la vigencia la decide el cliente.
  """
  cargos: [Cargo!]!

  """
  Los equipos que integra hoy. Secretaría no es un cargo: es esto.
  """
  equipos: [IntegranteDeEquipo!]!

  """
  Fecha de calendario en formato aaaa-mm-dd, sin hora ni zona horaria.
  """
  fechaDeNacimiento: String!
  id: ID!
  nombres: String!
  numeroDeDocumento: String!
  pertenencia: Pertenencia!
  tipoDeDocumento: TipoDeDocumento!
}

"""
Quién está autenticado en este pedido.
"""
type PersonaAutenticada {
  """
  Hasta cuándo vale la elevación, en ISO. Null si no está elevada.
  """
  elevadaHasta: String
  esAdministradorDesignado: Boolean!
  estaElevado: Boolean!
  personaId: ID!
  roles: [FuncionVigente!]!
}

"""
Como y desde cuando una persona pertenece a su grupo.
"""
type Pertenencia {
  categoria: Categoria!

  """
  Fecha de calendario en formato aaaa-mm-dd, sin hora ni zona horaria.
  """
  desde: String!

  """
  La unidad del grupo. Vacía si y sólo si la categoría es adherente. La rama sale de la unidad, que la pantalla ya tiene del grupo.
  """
  unidadId: ID
}

"""
Con qué proveedor externo se autentica una identidad.
"""
enum ProveedorDeIdentidad {
  apple
  demo
  google
}

type Query {
  """
  Los ids, de entre los preguntados, que ya tienen afiliación ese período.
  """
  afiliadosEn(periodo: Int!, personaIds: [ID!]!): [ID!]!
  cuentasDeGrupos: [CuentaDeGrupo!]!
  cuotasDeAfiliacion: [CuotaDeAfiliacion!]!

  """
  Las declaraciones de un grupo, de la más reciente a la más vieja.
  """
  declaraciones(grupoId: ID!): [Declaracion!]!

  """
  Null si quien pregunta no es autoridad diocesana de Tesorería.
  """
  deudasPendientes: ResumenDeDeudasPendientes

  """
  El arbol de la diocesis: distritos, sus grupos y sus unidades.
  """
  distritos: [Distrito!]!

  """
  Mira un enlace sin consumirlo. No pide sesión: el secreto es la autorización, y quien lo tiene ya podría consumirlo.
  """
  invitacion(secreto: ID!): Invitacion!

  """
  Quiénes conducen esos grupos el día dado. No filtra por alcance: es el directorio de la asociación, no los datos de la gente de un grupo.
  """
  jefesDeGrupos(fecha: String!, grupoIds: [ID!]!): [JefeDeGrupo!]!
  movimientosDeTesoreria(grupoId: ID!): [MovimientoDeTesoreria!]!

  """
  Null si quien pregunta no es autoridad diocesana de Tesorería.
  """
  periodosConfigurablesDeAfiliacion: [Int!]
  permiso(id: ID!): Permiso

  """
  Los permisos de un grupo, del más próximo al más viejo.
  """
  permisos(grupoId: ID!): [Permiso!]!

  """
  La persona de esta sesión, o null si el pedido es anónimo.
  """
  personaActual: PersonaAutenticada

  """
  Las personas de un grupo, ordenadas por apellido.
  """
  personas(grupoId: ID!): [Persona!]!

  """
  Devuelve la version de esta instancia.
  """
  version: Version!
}

"""
Ramas en que la asociacion divide a sus miembros por edad.
"""
enum Rama {
  adultos
  castores
  lobatos
  raiders
  rovers
  scouts
}

type ResultadoDeReconciliacion {
  cantidad: Int!
  creados: Int!
  periodosSinCuota: [Int!]!
}

type ResumenDeDeudasPendientes {
  cantidad: Int!
  periodosSinCuota: [Int!]!
}

"""
La función que un cargo o un equipo vigente concede.
"""
enum Rol {
  administracionDiocesana
  autoridadDeDistrito
  comisionadoDeDistrito
  directorDeGrupo
  dirigente
  jefeDeGrupo
  jefeScoutDiocesano
  secretariaDeGrupo
  tesoreriaDiocesana
}

"""
Como esta compuesta una unidad. Es un hecho del grupo, no de sus personas.
"""
enum SexoDeUnidad {
  femenina
  masculina
  mixta
}

"""
Donde mandar los bytes de un archivo, y hasta cuando vale.
"""
type SubidaPedida {
  """
  Instante en que la URL deja de valer, en ISO 8601.
  """
  expira: String!
  id: ID!

  """
  Ruta a la que hacer PUT con los bytes. Ya lleva el token.
  """
  url: String!
}

"""
Los cargos de la asociacion.
"""
enum TipoDeCargo {
  capellan
  comisionadoDeDistrito
  director
  jefeDeGrupo
  jefeDeRama
  jefeScoutDiocesano
  subjefeDeGrupo
}

"""
Tipos de documento que la asociacion acepta.
"""
enum TipoDeDocumento {
  dni
  pasaporte
}

"""
Los equipos funcionales que la autorización conoce.
"""
enum TipoDeEquipo {
  administracionDiocesana
  secretaria
  tesoreriaDiocesana
}

"""
Para qué es un enlace: activar el acceso, o recuperarlo.
"""
enum TipoDeInvitacion {
  activacion
  recuperacion
}

"""
La causa de un movimiento de la cuenta corriente.
"""
enum TipoDeMovimientoDeTesoreria {
  anulacion_pago
  cargo_afiliacion
  pago
}

"""
Una unidad del grupo: la Manada, una de las dos Tropas, el Clan.
"""
type Unidad {
  id: ID!

  """
  El nombre propio: "San Jorge".
  """
  nombre: String!

  """
  El tipo de unidad de su rama, su nombre y su sexo, ya compuestos.
  """
  nombreParaMostrar: String!
  rama: Rama!
  sexo: SexoDeUnidad!
}

"""
Version del sistema y modulos registrados.
"""
type Version {
  entorno: String!
  modulos: [String!]!
  numero: String!
}
