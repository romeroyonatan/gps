"""
Una fila de la nómina: cómo estaba esa persona el día de la declaración.
"""
type Afiliado {
  apellidos: String!
  nombres: String!
  numeroDeDocumento: String!
  personaId: ID!
  tipoDeDocumento: TipoDeDocumento!
}

"""
Un cargo de una persona en su grupo, con su periodo.
"""
type Cargo {
  cargo: TipoDeCargo!
  desde: String!

  """
  Vacía si no tiene fin previsto. Puede estar en el futuro: un mandato dura cuatro años.
  """
  hasta: String
}

"""
Como pertenece una persona a su grupo.
"""
enum Categoria {
  activo
  adherente
  beneficiario
}

"""
Un cargo en el alta. Su `desde` es el de la pertenencia.
"""
input DatosDeCargo {
  cargo: TipoDeCargo!
  hasta: String
}

"""
El grupo al que ingresa la persona, y como.
"""
input DatosDeIngreso {
  cargos: [DatosDeCargo!]!
  categoria: Categoria!
  desde: String!
  grupoId: ID!
  rama: Rama
}

"""
Los datos que necesita el alta de una persona.
"""
input DatosDePersona {
  apellidos: String!
  fechaDeNacimiento: String!
  nombres: String!
  numeroDeDocumento: String!
  tipoDeDocumento: TipoDeDocumento!
}

"""
La nómina que un grupo presenta en una fecha.
"""
type Declaracion {
  """
  Los de la nómina que todavía no tenían afiliación ese período.
  """
  aCobrar: [Afiliado!]!

  """
  La nómina completa del grupo ese día.
  """
  afiliados: [Afiliado!]!

  """
  Fecha de calendario en formato aaaa-mm-dd, sin hora ni zona horaria.
  """
  fecha: String!
  id: ID!

  """
  El año en que arranca el período al que cae esta declaración.
  """
  periodo: Int!
}

"""
Un distrito de la diocesis, con sus grupos.
"""
type Distrito {
  grupos: [Grupo!]!
  id: ID!
  numero: Int!
  zona: String!
}

"""
Un grupo scout y las ramas que tiene abiertas.
"""
type Grupo {
  id: ID!
  nombre: String!
  numero: Int!

  """
  De menor a mayor edad. Vacia si el grupo no abrio ninguna.
  """
  ramas: [Rama!]!
}

type Mutation {
  """
  Da de alta una persona y la inscribe en un grupo.
  """
  crearPersona(datos: DatosDePersona!, ingreso: DatosDeIngreso!): Persona!

  """
  Declaración extraordinaria: fotografía al grupo con la fecha de hoy.
  """
  declararAfiliacion(grupoId: ID!): Declaracion!
}

"""
Un miembro de la asociacion, con sus vinculos vigentes en su grupo.
"""
type Persona {
  apellidos: String!

  """
  Todos, también los vencidos: la vigencia la decide el cliente.
  """
  cargos: [Cargo!]!

  """
  Fecha de calendario en formato aaaa-mm-dd, sin hora ni zona horaria.
  """
  fechaDeNacimiento: String!
  id: ID!
  nombres: String!
  numeroDeDocumento: String!
  pertenencia: Pertenencia!
  tipoDeDocumento: TipoDeDocumento!
}

"""
Como y desde cuando una persona pertenece a su grupo.
"""
type Pertenencia {
  categoria: Categoria!

  """
  Fecha de calendario en formato aaaa-mm-dd, sin hora ni zona horaria.
  """
  desde: String!

  """
  Vacía si y sólo si la categoría es adherente.
  """
  rama: Rama
}

type Query {
  """
  Los ids, de entre los preguntados, que ya tienen afiliación ese período.
  """
  afiliadosEn(periodo: Int!, personaIds: [ID!]!): [ID!]!

  """
  Las declaraciones de un grupo, de la más reciente a la más vieja.
  """
  declaraciones(grupoId: ID!): [Declaracion!]!

  """
  El arbol de la diocesis: distritos, sus grupos y sus ramas.
  """
  distritos: [Distrito!]!

  """
  Las personas de un grupo, ordenadas por apellido.
  """
  personas(grupoId: ID!): [Persona!]!

  """
  Devuelve la version de esta instancia.
  """
  version: Version!
}

"""
Ramas en que la asociacion divide a sus miembros por edad.
"""
enum Rama {
  adultos
  castores
  lobatos
  raiders
  rovers
  scouts
}

"""
Los cargos de un grupo scout.
"""
enum TipoDeCargo {
  capellan
  director
  jefeDeGrupo
  jefeDeRama
  subjefeDeGrupo
}

"""
Tipos de documento que la asociacion acepta.
"""
enum TipoDeDocumento {
  dni
  pasaporte
}

"""
Version del sistema y modulos registrados.
"""
type Version {
  entorno: String!
  modulos: [String!]!
  numero: String!
}
