services:
  gps:
    build: .
    ports:
      - "3000:3000"
    environment:
      ENTORNO: ${ENTORNO:-desarrollo}
      BD: /datos/gps.db
      # Al volumen igual que la base: los escaneos y los PDF de los permisos
      # tienen que sobrevivir a que el contenedor se recree.
      DIRECTORIO_DE_ARCHIVOS: /datos/archivos
      # En produccion no hay clave por defecto y el proceso no arranca sin
      # esta: un sello hecho con una clave de desarrollo no prueba nada.
      CLAVES_DE_SELLO: ${CLAVES_DE_SELLO:-}
      CLAVE_DE_SELLO_ACTIVA: ${CLAVE_DE_SELLO_ACTIVA:-}
    volumes:
      - gps-datos:/datos
    healthcheck:
      test: ["CMD", "bun", "-e", "await fetch('http://localhost:3000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  gps-datos:
