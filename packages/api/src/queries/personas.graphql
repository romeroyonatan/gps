# packages/api/src/queries/personas.graphql
query Personas($grupoId: ID!) {
  personas(grupoId: $grupoId) {
    id
    tipoDeDocumento
    numeroDeDocumento
    nombres
    apellidos
    fechaDeNacimiento
    domicilio
    telefonoDeContacto
    pertenencia {
      categoria
      unidadId
      desde
    }
    cargos {
      id
      cargo
      desde
      hasta
    }
    equipos {
      id
      equipoId
      tipo
      desde
      hasta
    }
  }
}

mutation AsignarCargo(
  $personaId: ID!
  $cargo: TipoDeCargo!
  $ambitoId: ID
  $desde: String!
  $hasta: String
) {
  asignarCargo(
    personaId: $personaId
    cargo: $cargo
    ambitoId: $ambitoId
    desde: $desde
    hasta: $hasta
  ) {
    id
    cargo
  }
}

mutation RevocarCargo($cargoId: ID!) {
  revocarCargo(cargoId: $cargoId)
}

mutation IntegrarEquipo($personaId: ID!, $tipo: TipoDeEquipo!, $ambitoId: ID, $desde: String!) {
  integrarEquipo(personaId: $personaId, tipo: $tipo, ambitoId: $ambitoId, desde: $desde) {
    id
  }
}

mutation RevocarIntegranteDeEquipo($integranteId: ID!) {
  revocarIntegranteDeEquipo(integranteId: $integranteId)
}

query JefesDeGrupos($grupoIds: [ID!]!, $fecha: String!) {
  jefesDeGrupos(grupoIds: $grupoIds, fecha: $fecha) {
    grupoId
    personaId
    nombres
    apellidos
  }
}

mutation EditarPersona($personaId: ID!, $datos: DatosDePersona!) {
  editarPersona(personaId: $personaId, datos: $datos)
}

mutation CambiarDeUnidad($personaId: ID!, $unidadId: ID!, $desde: String!) {
  cambiarDeUnidad(personaId: $personaId, unidadId: $unidadId, desde: $desde)
}

mutation RegistrarPases($grupoId: ID!, $fecha: String!, $pases: [Pase!]!) {
  registrarPases(grupoId: $grupoId, fecha: $fecha, pases: $pases)
}
